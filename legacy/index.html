<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7C3AED" />
<title>Haz Tu Camino — Descubre qué carrera va contigo</title>
<meta name="description" content="Test vocacional, carreras, videos y simulaciones para descubrir tu futuro profesional. Hecho en Perú." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  /* ===== TOKENS ===== */
  :root {
    --pri: #7C3AED;
    --pri-d: #6D28D9;
    --pri-soft: #EDE9FE;
    --ink: #1E1B2E;
    --mut: #6B7280;
    --line: #E7E5EF;
    --bg: #F6F6FB;
    --card: #FFFFFF;
    --amber: #F59E0B;
    --danger: #DC2626;
    --ok: #059669;
    --radius: 18px;
    --radius-lg: 24px;
    --shadow: 0 6px 24px rgba(30, 27, 46, .08);
    --shadow-lg: 0 14px 44px rgba(30, 27, 46, .14);
    --area: #7C3AED;
    --area-soft: #EDE9FE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Nunito', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    min-height: 100vh;
  }
  img { max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--pri); outline-offset: 2px; border-radius: 8px; }

  /* ===== LAYOUT ===== */
  .layout { max-width: 1080px; margin: 0 auto; padding: 0 16px 96px; }
  .page { margin-top: 20px; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .center { text-align: center; }

  /* ===== TOPBAR ===== */
  .top {
    position: sticky; top: 0; z-index: 40;
    background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .top .layout { display: flex; align-items: center; gap: 18px; padding-top: 10px; padding-bottom: 10px; margin-bottom: 0; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.05rem; }
  .logo .mark {
    width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, var(--pri), #A855F7);
    display: grid; place-items: center; color: #fff; font-size: 20px;
    box-shadow: 0 4px 12px rgba(124,58,237,.35);
  }
  .top nav { display: none; gap: 4px; flex: 1; margin-left: 8px; }
  .top .tlink {
    padding: 8px 13px; border-radius: 12px; border: 0; background: transparent;
    font-weight: 700; font-size: .92rem; color: var(--mut); cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: .15s;
  }
  .top .tlink:hover { background: var(--bg); color: var(--ink); }
  .top .tlink.on { background: var(--pri-soft); color: var(--pri-d); }
  .top .grow { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: 999px; font-weight: 800; font-size: .85rem;
    border: 2px solid transparent; cursor: pointer; transition: .15s;
  }
  .pill.free { background: var(--bg); color: var(--mut); border-color: var(--line); }
  .pill.gold { background: #FEF3C7; color: #92400E; border-color: #FCD34D; }
  .pill:active { transform: scale(.96); }

  /* ===== BOTTOM NAV (móvil) ===== */
  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 24px rgba(30,27,46,.06);
  }
  .bitem {
    border: 0; background: transparent; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 2px; border-radius: 14px;
    font-size: .68rem; font-weight: 800; color: var(--mut); transition: .15s;
  }
  .bitem .ico { font-size: 20px; line-height: 1; }
  .bitem.on { color: var(--pri-d); background: var(--pri-soft); }

  /* ===== CARDS ===== */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 20px; }
  .hero { border-radius: var(--radius-lg); padding: 28px 22px; color: #fff; position: relative; overflow: hidden; }
  .h-pri { background: linear-gradient(135deg, #4C1D95 0%, #7C3AED 55%, #A855F7 100%); }
  .h-area { background: linear-gradient(135deg, var(--area), #0000 140%); }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px; font-size: .78rem; font-weight: 800; }

  /* ===== BOTONES ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 10px 18px; border-radius: 15px; border: 0;
    font-weight: 800; font-size: 1rem; cursor: pointer; transition: .15s;
    text-align: center; white-space: nowrap;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .pri { background: var(--pri); color: #fff; box-shadow: 0 6px 16px rgba(124,58,237,.32); }
  .pri:hover { background: var(--pri-d); }
  .opt { background: var(--pri-soft); color: var(--pri-d); }
  .line { background: #fff; color: var(--ink); border: 2px solid var(--line); }
  .line:active { background: var(--bg); }
  .ghost { background: transparent; color: var(--pri-d); }
  .done { background: var(--pri-soft); color: var(--pri-d); }
  .gold { background: linear-gradient(135deg, #F59E0B, #F97316); color: #fff; box-shadow: 0 6px 16px rgba(245,158,11,.35); }
  .danger { background: #FEE2E2; color: var(--danger); }
  .w100 { width: 100%; }
  .sml { min-height: 42px; padding: 8px 14px; font-size: .9rem; border-radius: 13px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.end { justify-content: flex-end; }
  .wrap { flex-wrap: wrap; }

  /* ===== FORM ===== */
  .label { display: block; font-size: .85rem; font-weight: 800; color: var(--mut); margin: 0 0 6px; }
  .input {
    width: 100%; min-height: 50px; border: 2px solid var(--line); border-radius: 14px;
    padding: 10px 14px; font-size: 1rem; font-family: inherit; background: #fff; color: var(--ink);
    transition: .15s;
  }
  .input:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-soft); }
  .field { margin-bottom: 16px; }
  .err { color: var(--danger); font-size: .8rem; font-weight: 700; margin-top: 5px; display: flex; align-items: center; gap: 5px; }
  .hint { font-size: .82rem; color: var(--mut); margin-top: 4px; }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button {
    min-height: 50px; border-radius: 14px; border: 2px solid var(--line); background: #fff;
    font-weight: 800; font-size: .9rem; cursor: pointer; transition: .15s; padding: 8px;
  }
  .seg button.on { border-color: var(--pri); background: var(--pri-soft); color: var(--pri-d); }

  /* ===== TEST ===== */
  .test-card { max-width: 620px; margin: 0 auto; }
  .tb { height: 12px; background: #EAE8F2; border-radius: 999px; overflow: hidden; }
  .tb > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--pri), #A855F7); transition: width .3s; }
  .answer {
    width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
    min-height: 66px; padding: 12px 16px; border-radius: var(--radius);
    border: 2px solid var(--line); background: #fff; cursor: pointer; transition: .15s;
    font-weight: 700; font-size: 1rem; color: var(--ink);
  }
  .answer:hover { border-color: var(--pri); transform: translateY(-1px); }
  .answer:active { transform: scale(.98); }
  .answer .e { font-size: 26px; }
  .answer .pts { margin-left: auto; font-size: .8rem; font-weight: 800; color: var(--mut); }
  .mini { background: none; border: 0; color: var(--mut); font-weight: 700; font-size: .88rem; cursor: pointer; padding: 8px; text-decoration: underline; text-decoration-style: dotted; }
  .mood { background: var(--pri-soft); border-radius: var(--radius); padding: 14px; margin: 16px 0; display: flex; gap: 12px; align-items: flex-start; }
  .mood b { display: block; color: var(--pri-d); }

  /* ===== CHART ===== */
  .bar-row { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; margin-bottom: 14px; }
  .bar-track { height: 18px; background: #EAE8F2; border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; min-width: 6px; transition: width .5s; }
  .bar-lbl { display: flex; justify-content: space-between; font-size: .82rem; font-weight: 800; margin-bottom: 4px; }

  /* ===== LISTAS / FILAS ===== */
  .list { display: grid; gap: 12px; }
  .krow {
    display: flex; align-items: center; gap: 14px; padding: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    transition: .15s;
  }
  .krow:active { transform: scale(.99); }
  .krow .grow { flex: 1; min-width: 0; }
  .krow h4 { font-size: .98rem; font-weight: 800; }
  .krow p { font-size: .85rem; color: var(--mut); }
  .kico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; flex-shrink: 0; font-size: 26px; background: var(--area-soft); }

  .city { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: .8rem; font-weight: 700; color: var(--mut); cursor: pointer; transition: .15s; }
  .city.on { background: var(--area-soft); border-color: var(--area); color: #fff; }
  .city.on { color: #fff; background: var(--area); border-color: var(--area); }

  .tag { display: inline-block; padding: 5px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: .8rem; font-weight: 700; }
  .ul { list-style: none; display: grid; gap: 8px; }
  .ul li { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; }
  .ul li::before { content: "✔"; color: var(--ok); font-weight: 900; }

  /* ===== LOCK / PREMIUM ===== */
  .lock {
    position: relative; border-radius: var(--radius); border: 2px dashed #D6C7F5;
    background: #F7F4FD; padding: 16px; min-height: 120px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    text-align: center; color: #6D28D9;
  }
  .lock .emo { font-size: 30px; }
  .lock .small { font-size: .85rem; font-weight: 700; color: var(--mut); }

  /* ===== COMPARAR ===== */
  .cmp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .cmp-block { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: #fff; }
  .cmp-block h5 { font-size: .85rem; font-weight: 800; color: #fff; background: var(--area); padding: 7px 12px; border-radius: 10px; margin-bottom: 10px; }
  .cmp-row { border-bottom: 1px dashed var(--line); padding: 10px 0; }
  .cmp-row:last-child { border-bottom: 0; }
  .cmp-row .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 800; color: var(--mut); }
  .cmp-row .v { font-size: .9rem; font-weight: 700; margin-top: 3px; }

  /* ===== MODAL / TOAST ===== */
  .overlay { position: fixed; inset: 0; z-index: 60; background: rgba(30,27,46,.55); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 18px; animation: none; }
  .modal { width: 100%; max-width: 480px; background: #fff; border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-lg); animation: pop .2s ease-out; max-height: 90vh; overflow: auto; }
  .modal h3 { font-size: 1.2rem; font-weight: 900; }
  @keyframes pop { from { transform: translateY(14px); opacity: 0; } }
  #toast {
    position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%);
    z-index: 80; background: var(--ink); color: #fff; font-weight: 800; font-size: .9rem;
    padding: 12px 20px; border-radius: 999px; box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none; transition: .25s; display: flex; gap: 8px; align-items: center;
    max-width: calc(100vw - 32px); text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  /* ===== LANDING ===== */
  .landing { max-width: 1080px; margin: 0 auto; padding: 20px 18px 40px; }
  .land-hero { text-align: center; padding: 26px 12px 8px; }
  .land-hero .big { font-size: 2.5rem; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
  .land-hero .big em { font-style: normal; background: linear-gradient(90deg, var(--pri), #A855F7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .land-hero p { color: var(--mut); font-size: 1.05rem; max-width: 420px; margin: 12px auto 22px; font-weight: 600; }
  .step { display: flex; gap: 14px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow); }
  .step .n { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 900; font-size: 1.1rem; flex-shrink: 0; background: var(--pri-soft); color: var(--pri-d); }
  .step b { display: block; font-size: 1rem; }
  .step small { color: var(--mut); font-weight: 600; font-size: .86rem; }
  .badge { font-size: .72rem; font-weight: 800; padding: 3px 8px; border-radius: 8px; letter-spacing: .03em; }
  .badge.free { background: var(--bg); color: var(--mut); }
  .badge.gold { background: #FEF3C7; color: #92400E; }

  footer.tiny { text-align: center; color: var(--mut); font-size: .8rem; font-weight: 700; margin-top: 34px; }

  @media (min-width: 900px) {
    .top nav { display: flex; }
    .bottom { display: none; }
    .layout { padding-bottom: 40px; }
    .land-hero .big { font-size: 3.2rem; }
    #toast { bottom: 32px; }
  }
</style>
</head>

/* ===================== STORE (localStorage) =====================
   En producción esto sería un backend real con base de datos.
   Aquí guardamos todo en localStorage con manejo de errores. */
const MEM = {}; // respaldo en memoria si localStorage no está disponible
function storeGet(key, def) {
  try {
    const raw = localStorage.getItem(key);
    return raw == null ? def : JSON.parse(raw);
  } catch (e) {
    if (e instanceof SyntaxError) return def;
    return MEM[key] !== undefined ? MEM[key] : def;
  }
}
function storeSet(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) {
    MEM[key] = val; // localStorage no disponible: seguimos en memoria
  }
}

const K_USERS = 'htc_users', K_SESSION = 'htc_session', K_REQ = 'htc_requests';

/* Hash simple de contraseña (solo para el prototipo).
   PRODUCCIÓN: nunca guardes contraseñas en el cliente; usa un backend. */
function hashPwd(str) {
  let h = 5381;
  for (let i = 0; i < String(str).length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return 'h' + (h >>> 0).toString(36);
}

function seed() {
  if (storeGet(K_USERS, null) != null) return;
  const users = {

  };
  storeSet(K_USERS, users);
  storeSet(K_REQ, []);
}

function sessEmail() { return storeGet(K_SESSION, null); }

}

  }

  if (Object.keys(errs).length) { loginErr = errs; vLogin(register); return; }

  const us = users();

  }
  loginErr = {};

}

        </button>`).join('')}
      </div>

      </div>

let lastQ = -1;
function answerTest(qid, opt) {
  const a = account();
  const q = PREGUNTAS.find(p => p.id === qid);
  let pts;
  if (opt === 'unknown') {
    if (!a.unknown.includes(q.area)) a.unknown.push(q.area);
    pts = 0;
  } else {
    pts = OPCIONES.find(o => o.id === opt).pts;
  }
  a.ans[qid] = pts;
  a.unknown = a.unknown.filter((v, i) => a.unknown.indexOf(v) === i);
  saveAccount(a);
  const pos = PREGUNTAS.findIndex(p => p.id === qid);
  if (pos + 1 >= PREGUNTAS.length) {
    finishTest(a);
  } else {
    tIdx = pos + 1;
    lastQ = qid;
    vTest();
  }
}
function prevQ() {
  const pos = tIdx >= 0 ? tIdx : 0;
  if (pos > 0) { tIdx = pos - 1; vTest(); }
}

function finishTest(a) {
  a.done = true;
  if (!a.history) a.history = [];
  const res = areaScores(a);
  a.history = [ { date: new Date().toLocaleDateString('es-PE', { day:'numeric', month:'short', year:'numeric' }), top: res.slice(0,3) }, ...a.history ].slice(0, 12);
  saveAccount(a);
  toast('¡Test completado!', '🎉');
  navigate('resultados');
}

function areaScores(acc) {
  return AREAS.map(ar => {
    const qs = PREGUNTAS.filter(p => p.area === ar.id);
    let sum = 0, count = 0;
    qs.forEach(p => { if (acc.ans[p.id] != null) { sum += acc.ans[p.id]; count++; } });
    const pct = Math.round((sum / 8) * 100);
    return { ...ar, pct, respondidas: count };
  }).sort((x, y) => y.pct - x.pct);
}

  window.open('https://www.youtube.com/results?search_query=' + q, '_blank', 'noopener');
}

/* ===== GUARDADAS ===== */
function vGuardadas() {
  const a = account();
  const list = CARRERAS.filter(c => a.saved.includes(c.id));
  appEl().innerHTML = shell(`
    <h1 style="font-size:1.4rem;font-weight:900">Guardadas ⭐</h1>
    <p style="color:var(--mut);font-weight:600;margin-bottom:14px">${list.length ? list.length + ' carreras guardadas.' : 'Aún no guardas carreras.'}</p>
    ${list.length ? `<div class="list">${list.map(c => `
      <div class="krow">
        <span class="kico" style="background:${area(c.area).soft}">${c.emoji}</span>
        <div class="grow"><h4>${c.nombre}</h4><p>${area(c.area).nombre}</p></div>
        <button class="btn sml danger" onclick="toggleSave('${c.id}')">Quitar</button>
        <button class="btn sml line" onclick="go('carrera/${c.id}')">Ver</button>
      </div>`).join('')}</div>` : `
      <div class="card" style="text-align:center;padding:40px 20px">
        <div style="font-size:48px">⭐</div>
        <p style="color:var(--mut);font-weight:700">Entra a Carreras y guarda tus favoritas.</p>
        <button class="btn pri" style="margin-top:14px" onclick="go('carreras')">Explorar carreras</button>
      </div>`}
  `, 'guardadas');
}

/* ===== PERFIL ===== */
function vPerfil() {
  const a = account();
  const nivelSel = a.nivel || 'secundaria';
  appEl().innerHTML = shell(`
    <h1 style="font-size:1.4rem;font-weight:900">Mi perfil 👤</h1>

    <div class="card" style="margin-top:14px">
      <div class="row" style="justify-content:space-between"><b style="font-weight:900">Cuenta</b>
        <span class="badge ${a.plan==='premium'?'gold':'free'}">${a.plan==='premium'?'⭐ Premium':'Gratis'}</span>
      </div>
      <div class="field" style="margin-top:14px">
        <label class="label" for="pf-name">Nombre</label>
        <input class="input" id="pf-name" value="${esc(a.name)}" />
      </div>
      <div class="field">
        <div class="label">Nivel educativo</div>
        <div class="seg">${NIVELES.map(n => `<button type="button" class="${nivelSel===n.id?'on':''}" onclick="pfNivel('${n.id}')">${n.label}</button>`).join('')}</div>
      </div>
      <div class="field">
        <label class="label">Correo</label>
        <input class="input" value="${esc(a.email)}" disabled />
      </div>
      <button class="btn pri w100" onclick="saveProfile()">Guardar cambios</button>
    </div>

    <div class="card" style="margin-top:14px">
      <b style="font-weight:900">Mis datos</b>
      <div class="row" style="justify-content:space-between;margin-top:12px;font-size:.92rem"><span style="color:var(--mut);font-weight:700">Test vocacional</span><b>${a.done?'✔ Completado':'Pendiente'}</b></div>
      <div class="row" style="justify-content:space-between;margin-top:8px;font-size:.92rem"><span style="color:var(--mut);font-weight:700">Simulaciones</span><b>${Object.keys(a.sims).length}/8</b></div>
      <div class="row" style="justify-content:space-between;margin-top:8px;font-size:.92rem"><span style="color:var(--mut);font-weight:700">Carreras guardadas</span><b>${a.saved.length}</b></div>
      <div class="row" style="justify-content:space-between;margin-top:8px;font-size:.92rem"><span style="color:var(--mut);font-weight:700">Plan actual</span><b>${a.plan==='premium'?'Premium':'Gratis'}</b></div>
      <button class="btn line w100" style="margin-top:14px" onclick="go('planes')">Ver planes y activar Premium</button>
    </div>

    <div class="card" style="margin-top:14px">
      <b style="font-weight:900">Historial de resultados</b>
      ${(a.history && a.history.length) ? `<div class="list" style="margin-top:10px">${a.history.map(h => `
        <div style="border:1px solid var(--line);border-radius:14px;padding:12px">
          <div style="font-size:.8rem;font-weight:800;color:var(--mut)">${h.date}</div>
          <div class="row wrap" style="margin-top:6px;gap:6px">${h.top.map(r => `<span class="tag" style="background:${r.soft};color:${r.color}">${r.emoji} ${r.nombre} ${r.pct}%</span>`).join('')}</div>
        </div>`).join('')}</div>` : '<p class="hint" style="margin-top:8px">Aún no completas tu test.</p>'}
    </div>

    <button class="btn danger w100" style="margin-top:18px" onclick="logout()">Cerrar sesión</button>
  `, 'perfil');
}
window.pfNivel = (id) => { const a = account(); a.nivel = id; saveAccount(a); vPerfil(); };
function saveProfile() {
  const a = account();
  const name = ($('pf-name')?.value || '').trim();
  if (name.length < 2) { toast('Escribe tu nombre', '⚠️'); return; }
  a.name = name;
  saveAccount(a);
  toast('Perfil actualizado');
}

/* ===== PLANES ===== */
function vPlanes() {
  const a = account();
  const insForm = (a.plan === 'premium')
    ? `<div class="card" style="margin-top:24px;background:#ECFDF5;border-color:#A7F3D0">
         <b style="color:var(--ok)">✔ Ya eres Premium</b>
         <p class="hint" style="margin-top:4px">Disfrutas de todo el contenido. Gracias por probar el prototipo.</p>
       </div>`
    : `
    <div class="card" id="ins-form" style="margin-top:24px">
      <b style="font-weight:900;font-size:1.05rem">🏫 Para instituciones</b>
      <p class="hint" style="margin-bottom:14px">Colegios, universidades e institutos: déjanos tus datos y te contactamos.</p>
      <div class="field">
        <label class="label" for="i-nombre">Institución</label>
        <input class="input" id="i-nombre" placeholder="Nombre de la institución" />
      </div>
      <div class="field">
        <label class="label" for="i-contacto">Contacto</label>
        <input class="input" id="i-contacto" type="email" placeholder="correo de contacto" />
      </div>
      <div class="field">
        <label class="label" for="i-estudiantes">Número de estudiantes</label>
        <input class="input" id="i-estudiantes" type="number" min="0" placeholder="p. ej. 500" />
      </div>
      <button class="btn pri w100" onclick="sendReq()">Enviar solicitud</button>
    </div>`;
  appEl().innerHTML = shell(`
    <h1 style="font-size:1.4rem;font-weight:900">Planes 🎁</h1>
    <p style="color:var(--mut);font-weight:600;margin-bottom:14px">Empieza gratis y hazte Premium cuando quieras.</p>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
      <div class="card" style="text-align:center">
        <div style="font-size:40px">🧡</div>
        <h2 style="font-weight:900;margin-top:6px">Gratis</h2>
        <p style="color:var(--mut);font-weight:600;font-size:.9rem;margin:6px 0 12px">Para empezar a descubrirte.</p>
        <ul class="ul" style="text-align:left;font-size:.9rem"> <li>Test vocacional completo</li><li>Información básica de carreras</li><li>3 simulaciones gratis</li><li>Carreras guardadas</li></ul>
        ${a.plan!=='premium' ? '<button class="btn line w100" style="margin-top:14px" onclick="go(\'login\')">Ya lo tienes</button>' : ''}
      </div>

      <div class="hero h-pri" style="text-align:center;display:flex;flex-direction:column">
        <div style="font-size:40px">⭐</div>
        <h2 style="font-weight:900;margin-top:6px">Premium</h2>
        <div style="font-weight:900;font-size:1.3rem;margin:4px 0 8px">S/ 19.90<span style="font-size:.85rem;opacity:.85"> / mes</span></div>
        <p style="opacity:.9;font-weight:600;font-size:.9rem">Todo gratis, sin límites.</p>
        <ul class="ul" style="text-align:left;font-size:.9rem;flex:1"> <li>Información completa de carreras</li><li>Las 8 simulaciones</li><li>Comparar carreras lado a lado</li><li>Recomendaciones personalizadas</li></ul>
        ${a.plan==='premium'
          ? '<button class="btn" style="background:#fff;color:var(--pri-d);margin-top:14px" disabled>✔ Activo</button>'
          : '<button class="btn gold w100" style="margin-top:14px" onclick="activatePremium()">Activar Premium (simulado)</button>'}
      </div>

      <div class="card" style="text-align:center">
        <div style="font-size:40px">🏫</div>
        <h2 style="font-weight:900;margin-top:6px">Instituciones</h2>
        <p style="color:var(--mut);font-weight:600;font-size:.9rem;margin:6px 0 12px">Colegios, universidades e institutos.</p>
        <ul class="ul" style="text-align:left;font-size:.9rem"> <li>Planes por volumen de estudiantes</li><li>Reportes de resultados</li><li>Orientación a docentes</li></ul>
        <button class="btn line w100" style="margin-top:14px" onclick="obtenerInst()">Solicitar información</button>
      </div>
    </div>

    <div class="mood" style="margin-top:16px"><span style="font-size:24px">ℹ️</span><div><b>Pago simulado</b><span style="color:var(--mut);font-weight:600"> En este prototipo no hay pagos reales: "Activar Premium" desbloquea todo sin cobrar.</span></div></div>

    ${insForm}
  `, 'planes');
}

function obtenerInst() {
  const el = $('ins-form');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function activatePremium() {
  const el = modal(`
    <div class="center">
      <div style="font-size:46px">💳</div>
      <h3>Pago simulado</h3>
      <p style="color:var(--mut);font-weight:600;margin-top:8px;font-size:.95rem">Estás por activar Premium. Esto desbloquea todo el contenido.<br><b>Es una demostración: no se realizará ningún cobro.</b></p>
      <div class="grid" style="margin-top:18px">
        <button class="btn gold w100" onclick="confirmPremium()">Activar Premium (simulado)</button>
        <button class="btn line w100" onclick="this.closest('.overlay').remove()">Cancelar</button>
      </div>
    </div>`);
  window.__premModal = el;
}
function confirmPremium() {
  const a = account();
  a.plan = 'premium';
  saveAccount(a);
  window.__premModal && window.__premModal.remove();
  toast('¡Bienvenido a Premium! (modo demo)', '⭐');
  render();
}

function sendReq() {
  const nombre = ($('i-nombre')?.value || '').trim();
  const contacto = ($('i-contacto')?.value || '').trim();
  const est = ($('i-estudiantes')?.value || '').trim();
  if (nombre.length < 2) return toast('Escribe el nombre de la institución', '⚠️');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contacto)) return toast('Correo de contacto no válido', '⚠️');
  if (!Number.isFinite(Number(est)) || Number(est) < 0) return toast('Indica un número de estudiantes válido', '⚠️');
  const lista = reqs();
  lista.push({ nombre, contacto, estudiantes: Number(est), fecha: new Date().toLocaleDateString('es-PE') });
  storeSet(K_REQ, lista);
  const box = $('ins-form');
  if (box) box.outerHTML = `<div class="card" style="margin-top:24px;background:#ECFDF5;border-color:#A7F3D0">
      <b style="color:var(--ok)">✔ Solicitud enviada</b>
      <p class="hint" style="margin-top:4px">Gracias, ${esc(nombre)}. Te contactaremos por ${esc(contacto)}.</p></div>`;
  toast('Solicitud enviada', '📩');
}

/* ===================== BOOT ===================== */
seed();
render();
</script>
</body>
</html>
